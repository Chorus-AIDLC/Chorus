services:
  app:
    image: chorusaidlc/chorus-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8637:8637"
    environment:
      - DATABASE_URL=postgresql://chorus:chorus@db:5432/chorus
      - REDIS_URL=redis://default:chorus-redis@redis:6379
      # ── JWT signing secret (signs user + super-admin session tokens) ──────
      # Leave empty and the container auto-generates a random secret on first
      # start and persists it to /app/data/.secret in the chorus-app-data
      # volume below (single replica only — do NOT rely on this for multiple
      # replicas). For production / multi-replica deployments set it
      # explicitly in .env or the environment on every replica:
      #   openssl rand -base64 32
      # Rotating the secret logs every user out. See docs/DOCKER.md
      # ("JWT secret security") and GitHub issue #559.
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DEFAULT_USER=${DEFAULT_USER:-}
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:-}
    volumes:
      # Persists the auto-generated JWT secret (/app/data/.secret) across
      # container recreates and image upgrades.
      - chorus-app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass chorus-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "chorus-redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chorus
      POSTGRES_PASSWORD: chorus
      POSTGRES_DB: chorus
    ports:
      - "5433:5432"
    volumes:
      - chorus-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chorus -d chorus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chorus-app-data:
  chorus-data:
  redis-data:
