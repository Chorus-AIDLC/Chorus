name: Test & Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      research-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Initialize isolated Research test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5435/postgres?sslmode=disable
        run: pnpm exec prisma db push

      - name: Run tests with coverage
        env:
          RESEARCH_DATABASE_URL: postgresql://postgres:postgres@localhost:5435/postgres?sslmode=disable
        run: pnpm test:coverage -- --reporter=json --outputFile=coverage/test-results.json

      - name: Run coordinated package-contract tests
        run: pnpm test:release-contract

      - name: Run plugin shell tests (Bash 3.2-compat syntax smoke + spec-mode resolver + skill/harness string blacklist + sub-agent session naming)
        # Note: the runner's bash is 5.x, so test-syntax.sh is a compatibility
        # smoke (it greps for Bash-4+ constructs), not execution on a real 3.2.
        run: |
          bash public/chorus-plugin/bin/test-syntax.sh
          bash public/chorus-plugin/bin/tests/test-spec-mode-resolution.sh
          bash public/chorus-plugin/bin/tests/test-resolver-drift.sh
          bash public/chorus-plugin/bin/tests/test-skill-harness-fidelity.sh
          # Negative cases for the guard above: proves it still FAILS on planted
          # violations, including under a repo path containing a space (where an
          # unquoted scope would silently scan nothing and report PASS).
          bash public/chorus-plugin/bin/tests/test-skill-harness-fidelity-negative.sh
          # Sub-agent session naming: name comes from the SubagentStart event's
          # agent_type (never the pre-fix `unknown-<digits>` pending filename).
          bash public/chorus-plugin/bin/tests/test-subagent-session-name.sh

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
