name: Publish Docker image

on:
  push:
    branches: [develop, main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  branch-image:
    name: Build & push branch image (no latest)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # De-dup: only the newest commit per branch survives; older runs are cancelled.
    concurrency:
      group: docker-branch-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push branch image
        env:
          CI: "true"
        run: ./scripts/docker-push.sh "${GITHUB_REF_NAME}" --no-latest

  release-image:
    name: Build & push release image (+ latest)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No concurrency block — release image builds must never be cancelled.
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push release image + latest
        env:
          CI: "true"
        run: ./scripts/docker-push.sh "${{ github.event.release.tag_name }}"
