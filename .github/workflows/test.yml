name: Test & Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: pnpm test:coverage -- --reporter=json --outputFile=coverage/test-results.json

      - name: Run coordinated package-contract tests
        run: pnpm test:release-contract

      - name: Run plugin shell tests (Bash 3.2-compat syntax smoke + spec-mode resolver + skill/harness string blacklist)
        # Note: the runner's bash is 5.x, so test-syntax.sh is a compatibility
        # smoke (it greps for Bash-4+ constructs), not execution on a real 3.2.
        run: |
          bash public/chorus-plugin/bin/test-syntax.sh
          bash public/chorus-plugin/bin/tests/test-spec-mode-resolution.sh
          bash public/chorus-plugin/bin/tests/test-resolver-drift.sh
          bash public/chorus-plugin/bin/tests/test-skill-harness-fidelity.sh

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
