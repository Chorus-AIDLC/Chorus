services:
  lan-https:
    image: ${CHORUS_HTTPS_IMAGE:-nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94}
    restart: unless-stopped
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "0.0.0.0:${CHORUS_HTTPS_PORT:-18638}:8443"
    volumes:
      - type: bind
        source: ./nginx.lan-https.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CHORUS_TLS_CERT_FILE:?Set CHORUS_TLS_CERT_FILE to an absolute certificate path outside the checkout}
        target: /etc/nginx/lan-tls/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CHORUS_TLS_KEY_FILE:?Set CHORUS_TLS_KEY_FILE to an absolute private key path outside the checkout}
        target: /etc/nginx/lan-tls/server.key
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
